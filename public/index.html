<!DOCTYPE html>
<html>
<head>
  <title>Botón Alarma OPUS</title>
</head>
<body>
  <h1>🚨 Botón de Alarma</h1>

  <button onclick="activarAlarma()" style="padding:20px; font-size:25px;">
    ACTIVAR ALARMA
  </button>

  <audio id="sonidoAlarma" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
  </audio>

  <script>
    async function activarAlarma() {
      await fetch("/api/alerta", { method: "POST" });
      alert("Alarma enviada 🔔");
    }

    // Cada 1 segundo revisa si alguien activó la alarma
    setInterval(async () => {
      const r = await fetch("/api/alerta");
      const data = await r.json();
      if (data.alarma) {
        sonarAlarma();
      }
    }, 1000);

    function sonarAlarma() {
      const audio = document.getElementById("sonidoAlarma");
      audio.play();

      const confirmar = confirm("🚨 ALARMA ACTIVADA\n\nPresiona ACEPTAR para detenerla.");

      if (confirmar) {
        audio.pause();
        fetch("/api/alerta", { method: "DELETE" });
      }
    }
  </script>
</body>
</html>
